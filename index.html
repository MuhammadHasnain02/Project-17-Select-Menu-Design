<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Menu Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Signika:wght@300..700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
        }

        /* Custom animation */
        @keyframes fadeSlideDown {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        .show-menu {
            display: block;
            animation: fadeSlideDown 0.6s ease forwards;
        }

        .hide-menu {
            animation: fadeSlideUp 0.5s ease forwards;
        }
  </style>

</head>

<body class="bg-linear-to-tl from-[#01BFBF] to-[#F49880] min-h-screen">

    <section class="flex flex-col items-center h-screen justify-center">
        <div class="flex flex-row justify-center space-x-10 px-10 py-8 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl shadow-md">
            
            <div class="flex flex-row items-center">
                <h2 class="flex flex-col text-3xl font-extrabold bg-gradient-to-br from-[#e17559] to-[#079393] bg-clip-text text-transparent drop-shadow-lg tracking-wide">
                    <span class="pl-0">Select Menu</span>
                    <span class="text-center">Design</span>
                </h2>
            </div>
    
            <div class="flex flex-col justify-center text-gray-200">

                <div id="selectField" class="">
                    <button id="changIcon" class="flex flex-row items-center justify-between w-68 space-x-10 border-1 border-[#c8cbd0] pr-3 pl-5 py-2.5 rounded-full transition duration-700 ease-in-out hover:scale-95 hover:cursor-pointer">
                        <p class="text-[16px] m-0">Select Social Media</p>
                        <i class="fa-solid fa-angle-down"></i>
                    </button>
                </div>
                <ul id="menuList" class="hidden absolute top-26 right-17 px-4 py-4 space-y-3.5 backdrop-blur-md border border-white/20 rounded-md w-[210px]">
                    
                    <li class="flex flex-row items-center gap-3 hover:border-b-1 hover:cursor-pointer">
                        <i class="fa-brands fa-youtube text-lg m-0"></i>
                        <p>Youtube</p>
                    </li>
                    <li class="flex flex-row items-center gap-3 hover:border-b-1 hover:cursor-pointer">
                        <i class="fa-brands fa-facebook text-lg m-0"></i>
                        <p>Facebook</p>
                    </li>
                    <li class="flex flex-row items-center gap-3 hover:border-b-1 hover:cursor-pointer">
                        <i class="fa-brands fa-instagram text-lg m-0"></i>
                        <p>Instagram</p>
                    </li>
                    <li class="flex flex-row items-center gap-3 hover:border-b-1 hover:cursor-pointer">
                        <i class="fa-brands fa-twitter text-lg m-0"></i>
                        <p>Twitter</p>
                    </li>
                    <li  class="flex flex-row items-center gap-3 hover:border-b-1 hover:cursor-pointer">
                        <i class="fa-brands fa-pinterest text-lg m-0"></i>
                        <p>Pinterest</p>
                    </li>
                    <li class="flex flex-row items-center gap-3 hover:border-b-1 hover:cursor-pointer">
                        <i class="fa-brands fa-whatsapp text-lg m-0"></i>
                        <p>Whatsapp</p>
                    </li>

                </ul>

            </div>
            
        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
